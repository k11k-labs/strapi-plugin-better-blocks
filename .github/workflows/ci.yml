name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # @strapi/sdk-plugin refuses Node 23+, so the matrix stops at 22.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected compares against a base commit, which it cannot find in
          # a shallow clone — without this it either rebuilds everything or
          # nothing.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Derive the base and head SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx affected -t lint,typecheck,test,build
