name: Release

# Deliberately manual. This repo is mid-consolidation and is going to move to a
# different organisation, so an accidental publish is the worst possible
# outcome — the npm secrets will not survive the transfer anyway. The workflow
# defaults to a dry run; publishing for real takes an explicit opt-in.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview versions and changelogs without writing or publishing anything'
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # nx release reads conventional commits since the last per-package tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version and changelog
        run: pnpm exec nx release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm exec nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
