name: Release — prepare

# Releases go through a pull request, the same gate as every other change.
# main requires a PR and GitHub Actions cannot be granted a bypass, so this
# workflow does not push to main: it opens a release PR instead. Publishing
# happens in "Release — publish" once that PR has landed.
#
# Defaults to a dry run: previewing costs nothing, publishing cannot be undone.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the versions and changelogs without opening a PR'
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # nx release reads conventional commits since the last per-package tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Preview versions and changelogs
        if: ${{ inputs.dry_run }}
        run: pnpm exec nx release --dry-run

      # nx.json sets release.git.{commit,tag,push} to false, so this only edits
      # manifests, changelogs and the lockfile. The commit, the branch and the
      # PR are this workflow's job; tagging waits until the PR is merged.
      - name: Apply versions and changelogs
        if: ${{ !inputs.dry_run }}
        run: pnpm exec nx release --skip-publish

      - name: Open the release PR
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "nx release changed nothing — there is nothing to release."
            exit 0
          fi

          branch="release/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore: release"
          git push origin "$branch"

          # List what is about to be released, so the PR is reviewable at a glance.
          versions=$(node -e "
            const fs = require('fs');
            for (const dir of fs.readdirSync('packages')) {
              const p = JSON.parse(fs.readFileSync('packages/' + dir + '/package.json', 'utf8'));
              if (!p.private) console.log('- \`' + p.name + '\` → **' + p.version + '**');
            }
          ")

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release" \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              'Version bumps and changelogs generated by \`nx release\`.' \
              "$versions" \
              'Merging this PR does not publish anything. Run **Release — publish** afterwards to tag the commit and push the packages to npm.')"
