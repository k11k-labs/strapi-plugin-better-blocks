# Named project so this stack coexists with other Better Blocks stacks (e.g. the
# strapi-plugin-better-blocks playground, which publishes Strapi on host :1337).
name: better-blocks-react-renderer

services:
  strapi:
    container_name: better-blocks-react-renderer-strapi
    build:
      context: ..
      dockerfile: playground/strapi/Dockerfile
    ports:
      # Host :1338 to avoid clashing with other Strapi stacks on :1337.
      # Container port stays 1337, so the internal `strapi:1337` DNS is unchanged.
      - '1338:1337'
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: dockerKey1,dockerKey2,dockerKey3,dockerKey4
      API_TOKEN_SALT: docker-api-token-salt
      ADMIN_JWT_SECRET: docker-admin-jwt-secret
      TRANSFER_TOKEN_SALT: docker-transfer-token-salt
      ENCRYPTION_KEY: docker-encryption-key
      JWT_SECRET: docker-jwt-secret
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db

  react-app:
    container_name: better-blocks-react-renderer-react-app
    build:
      context: ..
      dockerfile: playground/react-app/Dockerfile
    ports:
      - '5173:5173'
    environment:
      STRAPI_URL: http://strapi:1337
    depends_on:
      - strapi
