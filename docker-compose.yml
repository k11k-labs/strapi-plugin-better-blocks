# One stack for the whole repo: a Strapi instance running the plugin and seeded
# with every showcase article, plus both renderers reading that same content.
#
#   docker compose up --build
#
#   Strapi admin   http://localhost:1337/admin   (admin@example.com / admin12#)
#   React example  http://localhost:5173
#   Astro example  http://localhost:4321
#
# The renderer services bind-mount their own source, so editing an example app
# hot-reloads. Changing plugin or renderer source needs `--build`, since those
# are compiled into the image.

name: better-blocks

x-workspace: &workspace
  build:
    context: .
    dockerfile: Dockerfile
  image: better-blocks-workspace:latest

services:
  strapi:
    <<: *workspace
    container_name: better-blocks-strapi
    command: pnpm --filter @qkix/example-strapi-app develop
    ports:
      - '1337:1337'
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: dockerKey1,dockerKey2,dockerKey3,dockerKey4
      API_TOKEN_SALT: docker-api-token-salt
      ADMIN_JWT_SECRET: docker-admin-jwt-secret
      TRANSFER_TOKEN_SALT: docker-transfer-token-salt
      ENCRYPTION_KEY: docker-encryption-key
      JWT_SECRET: docker-jwt-secret
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      NODE_ENV: development
    volumes:
      # Keep the seeded database and uploaded media across restarts. Delete
      # these volumes to re-seed from scratch.
      - strapi_data:/workspace/examples/strapi-app/.tmp
      - strapi_uploads:/workspace/examples/strapi-app/public/uploads
    healthcheck:
      # The renderers fetch articles at startup, so they must not race the
      # first boot — which also runs the seeding.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:1337/api/articles?status=published').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  react:
    <<: *workspace
    container_name: better-blocks-react
    command: pnpm --filter @qkix/example-react-app dev -- --host
    ports:
      - '5173:5173'
    environment:
      STRAPI_URL: http://strapi:1337
    volumes:
      - ./examples/react-app/src:/workspace/examples/react-app/src:ro
      - ./examples/react-app/index.html:/workspace/examples/react-app/index.html:ro
    depends_on:
      strapi:
        condition: service_healthy

  astro:
    <<: *workspace
    container_name: better-blocks-astro
    command: pnpm --filter @qkix/example-astro-app dev -- --host
    ports:
      - '4321:4321'
    environment:
      STRAPI_URL: http://strapi:1337
    volumes:
      - ./examples/astro-app/src:/workspace/examples/astro-app/src:ro
    depends_on:
      strapi:
        condition: service_healthy

volumes:
  strapi_data:
  strapi_uploads:
